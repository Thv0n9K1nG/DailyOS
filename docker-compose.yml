services:
  mysql:
    image: mysql:8.0
    container_name: lifeboard-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: lifeboard
      MYSQL_USER: lifeboard_user
      MYSQL_PASSWORD: StrongPassword123!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./LifeBoard.API
      dockerfile: Dockerfile
    container_name: lifeboard-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=lifeboard;Uid=lifeboard_user;Pwd=StrongPassword123!;CharSet=utf8mb4;DateTimeKind=Unspecified;ConvertZeroDateTime=True;
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./lifeboard-client
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:5000/api/v1
    container_name: lifeboard-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mysql_data:
